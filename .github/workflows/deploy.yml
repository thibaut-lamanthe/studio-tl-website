name: Deploy to Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build i18n : génère dist/index.html (FR) + dist/en/index.html (EN)
      # + dist/.htaccess + copie dist/assets/ depuis assets/.
      - name: Build i18n (FR + EN)
        run: node build.js

      # Minify les deux versions HTML (CSS + JS inline inclus).
      # Le repo source garde son code commenté ; ce qui part en FTP est
      # la version compressée.
      - name: Install minifier
        run: npm install --no-save --no-package-lock html-minifier-terser

      - name: Minify FR
        run: |
          npx html-minifier-terser dist/index.html \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true \
            --minify-js true \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --decode-entities \
            -o dist/index.min.html
          mv dist/index.min.html dist/index.html

      - name: Minify EN
        run: |
          npx html-minifier-terser dist/en/index.html \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true \
            --minify-js true \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --decode-entities \
            -o dist/en/index.min.html
          mv dist/en/index.min.html dist/en/index.html

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # On déploie le contenu de dist/ uniquement.
          local-dir: ./dist/
          exclude: |
            **/.DS_Store
