name: Deploy to Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          sftp_only: true
          local_path: './*'
          remote_path: ${{ secrets.FTP_REMOTE_DIR }}
          # On ne supprime pas les fichiers distants pour éviter
          # tout drame en cas de mauvais chemin distant
          delete_remote_files: false
          exclude: '.git, .github, .gitignore, README.md, node_modules, .DS_Store, .vscode'
