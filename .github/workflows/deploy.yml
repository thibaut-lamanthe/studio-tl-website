name: Deploy to Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build i18n, verify the essential SEO files, minify both HTML files
      # then re-check the dist/ folder before the FTP upload.
      - name: Prepare deploy build
        run: npm run deploy:prepare

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # Deploy the contents of dist/ only.
          local-dir: ./dist/
          exclude: |
            **/.DS_Store
