<!-- Preload critical fonts: starts the fetch in parallel with HTML
     parsing, without waiting for the <style> @font-face to be evaluated.
     Drastically reduces FOUT (flash of fallback font) on prod where
     network latency makes the delay visible.
     `crossorigin` is REQUIRED for fonts even same-origin (spec).
     `type="font/woff2"` tells the browser it can skip sniffing. -->
<link rel="preload" href="assets/fonts/NeueMontreal-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/NeueMontreal-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/NeueMontreal-Bold.woff2" as="font" type="font/woff2" crossorigin>

<!-- SYNCHRONOUS inline script to apply the right theme BEFORE the paint.
     Without it, we get a FOUC: the page loads in light (CSS default), then
     the body JS detects prefers-color-scheme: dark and switches, creating a
     light → dark flash visible to the eye. Here we get ahead of it. -->
<script>
  (function() {
    try {
      var stored = localStorage.getItem('studiotl-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var mode = (stored === 'dark' || stored === 'light') ? stored : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', mode);
      if (mode === 'dark') document.documentElement.classList.add('is-dark');
    } catch(e) {}
  })();
</script>

<style>
  /* ---------- Neue Montreal (self-hosted, woff2) ----------
     Light (300) removed: unused. Three weights loaded: Regular (400),
     Medium (500), Bold (700). */

    src: url("assets/fonts/NeueMontreal-Regular.woff2") format("woff2");

<style>
  /* ---------- Tokens ---------- */
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --t-fast: 180ms;
    --t-med: 420ms;

    --pad-x: clamp(20px, 4vw, 48px);
    --pad-y: clamp(20px, 3.2vw, 36px);
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #000000;
      --fg: #ffffff;
    }
  }

  /* ---------- Reset-ish ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Neue Montreal", ui-sans-serif, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.01em;
    transition: background-color 500ms var(--ease), color 500ms var(--ease);
    overflow: hidden;
    cursor: default; /* No I-beam on normal text */
  }
  a { color: inherit; text-decoration: none; cursor: pointer; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  /* Text selection: bg = ink color, text = background color
     → in light mode: bg black / text white, in dark mode: bg white / text black. */
  ::selection { background: var(--fg); color: var(--bg); }
  ::-moz-selection { background: var(--fg); color: var(--bg); }

  /* ---------- Layout ---------- */
  .page {
    position: relative;
    /* No z-index or filter here → .page does not create a stacking context.
       Its children (header, .info, .logo-center, footer) therefore participate
       in the body's stacking context, which allows:
        - giving them a z-index relative to the cursor
        - the cursor to blend (mix-blend-mode: difference) with them */
    min-height: 100svh;
    /* Flex column with justify-content: space-between → header at the very top,
       footer at the very bottom. main.stage is position: absolute (out of the
       flex flow) and centered on the viewport via inset:0 + place-items:center →
       the central content is always exactly at the vertical middle of the page,
       regardless of the respective header/footer heights (otherwise, since
       the header is larger, the center of the 1fr grid would be offset). */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: var(--pad-y) var(--pad-x);
  }

  /* ---------- Custom cursor ----------
     Small white dot (12px, 36px on hover) that follows the mouse with lerp.
     mix-blend-mode: difference → color inverts depending on what's
     behind it (black on light bg, white on dark bg, and inversion over the
     text / icons / SVG of the header / footer / toggle / logo). */
  .cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--cursor-size, 12px);
    height: var(--cursor-size, 12px);
    border-radius: 50%;
    background: #fff;
    pointer-events: none;
    mix-blend-mode: difference;
    z-index: 2;
    /* translate (individual) for the position via JS, transform to center
       the target on the mouse (50% of the current size, auto-scale with --cursor-size). */
    translate: -200px -200px;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 200ms var(--ease),
                width 280ms var(--ease),
                height 280ms var(--ease);
    will-change: translate;
  }
  .cursor.is-hover { --cursor-size: 36px; }
  /* Hover specific to the dark mode toggle: larger cursor to
     accentuate the interactive zone (the toggle is bigger than the mailto). */
  .cursor.is-hover-lg { --cursor-size: 45px; }
  /* On tablet / phone: no custom cursor */
  @media (hover: none), (pointer: coarse) {
    .cursor { display: none; }
  }

  header.bar, footer.bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .meta {
    font-size: 15px;
    line-height: 1;
    letter-spacing: 0.02em;
    color: var(--fg);
    font-weight: 400;
  }

  /* ---------- Brand mark (top-left) ----------
     Padding + negative margin symmetric to the toggle: not for the hit
     area (it's a plain <div>, no click), but to give the brand
     the same box dimensions as the toggle. Without it, the brand would be
     shorter vertically → the header.bar flex align-items: center
     would not match the "Studio" + mark visual with the toggle SVG. */
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 20px;
    letter-spacing: 0.02em;
    color: var(--fg);
    font-weight: 700;
    padding: 12px;
    margin-left: -12px;
    margin-top: -12px;
  }
  .brand .mark {
    width: 25px;
    height: 23px;
    display: inline-flex;
  }
  .brand .mark svg { width: 100%; height: 100%; display: block; }

  /* ---------- Theme toggle (top-right) ----------
     Circular button with a sun/moon SVG that transforms:
     - light mode → sun (solid circle + beams)
     - dark mode  → moon (solid circle with a mask that carves the crescent)
     CSS animation via cx (of the mask circle) + scale (of the sun) + rotate (of the beams).
     Inspiration source: "Sun & Moon Theme Toggle" by Adam Argyle. */
  .toggle {
    border-radius: 50%;
    border: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    /* Padding 12px all around → hover/click zone widened by 12px on
       each side of the SVG. margin-right/-top: -12px compensate for the
       corresponding paddings → the SVG visual stays aligned with the right edge
       AND the top edge of the page (otherwise it would be offset 12px
       inward relative to the origin). */
    padding: 12px;
    margin-right: -12px;
    margin-top: -12px;
    background: transparent;
    cursor: pointer;
    scale: 1;
    transition: scale var(--t-fast) var(--ease);
  }
  .toggle:hover { scale: 1.1; }

  .sun-and-moon {
    width: 22px;
    height: 22px;
    display: block;
    color: var(--fg);
  }
  .sun-and-moon > :is(.moon, .sun, .sun-beams) { transform-origin: center center; }
  .sun-and-moon > :is(.moon, .sun) { fill: currentColor; }
  .sun-and-moon > .sun-beams {
    stroke: currentColor;
    stroke-width: 2px;
    stroke-linecap: round;
  }
  /* Default state (= light mode for us): MOON visible.
     We apply the transforms that turn the sun SVG into a moon
     (sun scale 1.75 so it fills + mask circle moved to carve
     the crescent + beams hidden via opacity 0 and rotation -25°).
     MIKII convention: the toggle shows the ALTERNATIVE (click to switch). */
  .sun-and-moon > .sun { transform: scale(1.75); }
  .sun-and-moon > .sun-beams {
    opacity: 0;
    transform: rotate(-25deg);
  }
  /* Mask circle is positioned at cx="17" in the HTML (= default moon
     state, the black disc bites into the sun-circle to carve the crescent).
     The animation uses transform:translateX instead of the CSS property
     cx → compatibility with Safari < 15.4 and all WebKit where @supports(cx:1)
     could be false. On the default moon: translate 0. */
  .sun-and-moon .moon > circle { transform: translateX(0); }

  /* The .show-sun class (on the .toggle BUTTON, toggled by JS on the immediate click,
     WITHOUT waiting for the wipe to finish) → SVG returns to its natural state (sun + beams).
     This decoupling is what makes the toggle animation responsive to the click, while
     the wipe + theme swap happens with its own 700ms timing. */
  .toggle.show-sun .sun-and-moon > .sun { transform: scale(1); }
  .toggle.show-sun .sun-and-moon > .sun-beams {
    opacity: 1;
    transform: none;
  }
  /* Sun mode: we push the mask circle out of the sun's zone → mask
     becomes fully white → sun visible as a full disc. translateX(7px) ≈
     7 user-units (SVG is rendered ~22-24px ≈ viewBox 24), moves cx 17 → ~24. */
  .toggle.show-sun .sun-and-moon .moon > circle { transform: translateX(7px); }

  /* ASYMMETRIC transitions, MIKII style:
     - "toward the sun" direction (.show-sun applied): long elastic
       → the sun arrives bursting in
     - "toward the moon" direction (.show-sun removed = default state): short
       → the sun eclipses fast, the moon appears with a delay */

  /* Base = default state (toward the MOON): fast timing */
  .sun-and-moon > .sun {
    transition: transform 0.25s cubic-bezier(0.25, 0, 0.3, 1);
  }
  .sun-and-moon > .sun-beams {
    transition: transform 0.15s cubic-bezier(0.25, 0, 0.3, 1),
                opacity 0.15s cubic-bezier(0.25, 0, 0.3, 1);
  }
  .sun-and-moon .moon > circle {
    transition: transform 0.5s cubic-bezier(0, 0, 0, 1);
    transition-delay: 0.25s;
  }

  /* Override when switching toward the SUN (.show-sun): long elastic */
  .toggle.show-sun .sun-and-moon > .sun {
    transition: transform 0.5s cubic-bezier(0.5, 1.25, 0.75, 1.25);
  }
  .toggle.show-sun .sun-and-moon > .sun-beams {
    transition: transform 0.5s cubic-bezier(0.5, 1.5, 0.75, 1.25),
                opacity 0.5s cubic-bezier(0.25, 0, 0.3, 1);
  }
  .toggle.show-sun .sun-and-moon .moon > circle {
    transition: transform 0.25s cubic-bezier(0, 0, 0, 1);
    transition-delay: 0s;
  }

  /* ---------- Theme wipe (radial transition between light/dark) ----------
     Full-screen circle centered on the click position, with backdrop-filter:
     invert(1) that inverts the colors as it grows.
     At T=700, we swap data-theme atomically with the wipe disappearing.
     Math: invert(old theme) = new theme look → invisible snap
     (no pop between inverted-old and actual-new). */
  #theme-wipe {
    position: fixed;
    left: 0;
    top: 0;
    width: 100vmax;
    height: 100vmax;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    backdrop-filter: invert(1);
    -webkit-backdrop-filter: invert(1);
    transform: translate(-50%, -50%) scale(0);
    transition: transform 700ms cubic-bezier(0.65, 0, 0.35, 1);
  }
  #theme-wipe.is-wiping {
    transform: translate(-50%, -50%) scale(3);
  }

  /* ---------- Center stage ----------
     position: absolute + inset: 0 → main.stage covers the whole viewport
     (= containing block .page which is 100svh) → place-items: center
     centers the content EXACTLY at the middle of the viewport, regardless of the
     header or footer height.
     pointer-events: none + auto on .stack → main visually covers
     header/footer but does not capture their clicks. */
  main.stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    padding: clamp(24px, 6vh, 80px) 0;
    pointer-events: none;
  }
  main.stage > .stack { pointer-events: auto; }
  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px;
  }

  .logo-center {
    position: relative;
    z-index: 1; /* < cursor (z:2) → cursor passes ABOVE the logo and inverts its colors via mix-blend-mode */
    width: 350px;
    max-width: 70vw;
    aspect-ratio: 633.2 / 583.04;
    color: var(--fg);
    /* No animation on the wrapper — each polygon of the logo animates
       individually (see rule below) for a "construction" effect. */
  }
  .logo-center svg {
    width: 100%;
    height: 100%;
    display: block;
    /* By default, an SVG clips its content to its viewBox. During the
       entrance anim, the polygons translate by ±32px and "leave the frame".
       Without overflow: visible, they are clipped at the edges. */
    overflow: visible;
  }
  /* The L body is rendered in var(--fg) via direct fill on the polygons
     (overrides the currentColor inheritance) → the color lerps on theme
     toggle via the CSS transition.
     Anti-aliasing fix: a stroke with the SAME color as the fill, to
     fill in the transparent sub-pixels at the shared edges between
     adjacent polygons. */
  .logo-center .logo-svg polygon {
    fill: var(--fg);
    stroke: var(--fg);
    stroke-width: 1;
    stroke-linejoin: miter;
  }
  /* Center logo entrance: each polygon slides up with stagger.
     The highlight (back face) appears first, then the 3 front faces
     in cascade. Gives a "the logo builds itself" feeling. */
  /* Construction-style entrance, iso 30°: each face enters from its "normal"
     in the 3D perspective (top bar falls from above, lip comes from the left,
     tower and middle rise from the bottom, triangle arrives from upper-right). */
  .logo-center .logo-svg .face {
    opacity: 0;
    animation-duration: 0.9s;
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    animation-fill-mode: both; /* both → from state during the delay, to state after */
  }
  /* Cascade: tower and middle FIRST (both verticals fall from the top),
     then highlight, top, lip follow, and finally the triangle.
     opacity: 1 → overrides the base rule (opacity: 0) to NOT have a fade:
     the reveal is handled solely by the clip-path. */
  .logo-center .logo-svg .face-tower {
    animation-name: poly-reveal-from-top;
    animation-delay: 300ms;
    animation-duration: 1.4s;
  }
  .logo-center .logo-svg .face-middle {
    animation-name: poly-reveal-from-top;
    animation-delay: 400ms;
    animation-duration: 1.4s;
  }
  .logo-center .logo-svg .face-top {
    animation-name: poly-from-top-right-iso;    animation-delay: 200ms;
    animation-duration: 1.4s;
  }
  .logo-center .logo-svg .face-lip {
    animation-name: poly-from-bottom-left-iso;     animation-delay: 100ms;
    animation-duration: 1.4s;
  }
  /* Triangle: opacity 0 at the start (see base rule) then flips to 1 at 400ms
     (= moment when face-middle starts to appear). Before that, the triangle
     is at its initial position (translate -105, 44) and a small pixel
     poked out above the highlight; by hiding it at opacity 0, we
     eliminate the visual defect. The slide then starts at 600ms.
     Two parallel animations via shorthand: triangle-show (opacity flip)
     + triangle-slide-no-fade (translation). */
  .logo-center .logo-svg .face-triangle {
    animation:
      triangle-show 1ms linear 550ms forwards,
      triangle-slide-no-fade 1.4s cubic-bezier(0.16, 1, 0.3, 1) 600ms both;
  }
  @keyframes triangle-show {
    to { opacity: 1; }
  }
  /* Diagonal slide 22.7° from farther away (~115px total distance),
     WITHOUT fade-in (opacity stays at 1).
     Math: 115 * cos(22.7°) ≈ 106, 115 * sin(22.7°) ≈ 44.4. */
  @keyframes triangle-slide-no-fade {
    from { transform: translate(-105px, 44px); }
    to   { transform: translate(0, 0); }
  }
  /* Inverted "iso" reveal: the cut line follows the other iso direction
     (parallel to the bottom edge of the vertical faces, so DOWN-RIGHT).
     0%: line at (-16% left, 0% right) → above the polygon, nothing visible.
     100%: line at (84% left, 100% right) → at the bottom edge, everything visible.
     With fade-in opacity 0 → 1 in parallel. */
  @keyframes poly-reveal-from-top {
    0%   { opacity: 0; clip-path: polygon(0% 0%, 100% 0%, 100% 0%, 0% -16%); }
    100% { opacity: 1; clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 84%); }
  }
  /* Diagonal 22.7° (isometric angle of the logo) → bottom-left
     Total distance 32 units: -32*cos(22.7°), +32*sin(22.7°) ≈ (-29.5, 12.4) */
  @keyframes poly-from-bottom-left-iso {
    from { opacity: 0; transform: translate(-29.5px, 12.4px); }
    to   { opacity: 1; transform: translate(0, 0); }
  }
  /* Symmetric: from top-right at 22.7° → (+29.5, -12.4) */
  @keyframes poly-from-top-right-iso {
    from { opacity: 0; transform: translate(29.5px, -12.4px); }
    to   { opacity: 1; transform: translate(0, 0); }
  }

  .info {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 20px;
    font-weight: 500;
    color: var(--fg);
    /* No animation on the wrapper — each line has its own fade-in. */
  }
  /* The tagline is the page's <h1>: drop the UA heading styles so it
     inherits the .info typography. */
  .info h1 {
    margin: 0;
    font: inherit;
  }
  /* Text lines entrance: subtle fade-in + slight Y translate.
     Short stagger (250ms) → line 2 starts before line 1 has finished.
     pointer-events: none during the animation → as long as the mailto is not
     visible, it intercepts no events (no cursor pointer
     nor is-hover on the custom cursor). At 100% of the animation, the
     keyframe sets pointer-events to auto and it's frozen by animation-fill-mode: forwards. */
  .info > * {
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    animation: line-in 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .info > *:nth-child(1) { animation-delay: 1400ms; }
  .info > *:nth-child(2) { animation-delay: 1520ms; }
  @keyframes line-in {
    to { opacity: 1; transform: translateY(0); pointer-events: auto; }
  }
  /* Contact link with sliding underline */
  .contact {
    position: relative;
    display: inline-block;
    padding-bottom: 4px;
    white-space: nowrap;
    font-weight: 700;
  }
  .contact::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 3px;
    background: currentColor;
    /* clip-path states:
       - default (non-hovered) : inset(0 100% 0 0) → 0-width at the LEFT edge (invisible)
       - .is-hovering           : inset(0 0 0 0)    → fully visible
       - .underline-leaving     : inset(0 0 0 100%) → 0-width at the RIGHT edge (invisible)
       Reveal animation: default → .is-hovering = reveals from the LEFT.
       Leave animation : .is-hovering → .underline-leaving = disappears to the RIGHT.
       On the next enter, JS resets to default without transition to restart from the LEFT. */
    clip-path: inset(0 100% 0 0);
    transition: clip-path var(--t-med) var(--ease);
  }
  .contact.is-hovering::after { clip-path: inset(0 0 0 0); }
  .contact.underline-leaving::after { clip-path: inset(0 0 0 100%); }
  .contact.no-transition::after { transition: none; }
  .contact:focus-visible::after { clip-path: inset(0 0 0 0); }

  /* ---------- Status (footer) ---------- */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .status .pulse {
    position: relative;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--fg);
  }
  .status .pulse::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--fg);
    /* transform-origin center: the scale keeps the ring centered on the dot.
       will-change: pushes the layer onto the GPU compositor from the start. */
    transform-origin: center;
    will-change: transform, opacity;
    animation: pulse 2.4s ease-out infinite;
  }
  /* 100% composite animation (transform + opacity) → stable 60fps, no
     "pixel by pixel" jank. Before: we animated `inset` (= top/right/bottom/
     left), which triggers layout on every frame. Now: scale 1→4
     visually reproduces the 6px→24px expansion (equivalent to inset 0→-9px)
     WITHOUT touching the layout. */
  @keyframes pulse {
    0%   { transform: scale(1); opacity: 0.5; }
    60%  { opacity: 0; }
    100% { transform: scale(4); opacity: 0; }
  }

  /* ---------- Footer rows ---------- */
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .row.right { justify-content: flex-end; }
  .clock { font-variant-numeric: tabular-nums; }

  /* ---------- Animations ---------- */
  @media (prefers-reduced-motion: reduce) {
    /* We disable only the one-shot entrance animations (logo + letters
       rising from the bottom) — that's polish, not critical.
       The UI transitions (toggle morph, cursor scale, magnetic) stay active
       since they are subtle and essential to the experience. The theme wipe
       is skipped in JS (see the theme toggle click handler). */
    .logo-center, .info, .info > *,
    .logo-center .logo-svg polygon {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      pointer-events: auto !important;
    }
  }

  /* ---------- Responsive ----------
     Mobile: ~90% ratio to keep the hierarchy (header = center,
     footer a notch below). Desktop & tablet stay at the default. */
  @media (max-width: 640px) {
    .meta-hide-mobile { display: none; }
    .brand { font-size: 18px; }
    .meta { font-size: 14px; }
    .info { font-size: 18px; margin: 0; }
    .row { gap: 8px; }
    /* Smaller toggle SVG on mobile. The header's flex align-items: center
       keeps the common vertical axis with the brand (Studio + mark). */
    .sun-and-moon { width: 18px; height: 18px; }
    /* "(mais là, je dors)" too verbose next to the status on mobile. */
    .status-aside { display: none; }
  }
  @media (max-width: 420px) {
    .info .meta-shrink { display: none; }
  }

  /* ---------- Focus ---------- */
  :focus-visible {
    outline: 1px solid var(--fg);
    outline-offset: 4px;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <!-- Hidden SVG definitions (logo mask) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Logo mask: the highlight shape (back face of the iso L) is
           carved into a transparent hole → negative that draws the L's edge.
           White = visible, black = invisible.
           Mask region extended to -500 / +1633 (= viewBox + ~500 units of
           padding each side): the polygons that translate far during
           the entrance anim (triangle at -105px, lip at -29.5px, etc.) stay
           INSIDE the mask region → visible. Without this extension, they
           were masked out because they fell outside the mask's defined area. -->
      <mask id="logo-mask" maskUnits="userSpaceOnUse" x="-500" y="-500" width="1633.2" height="1583.04">
        <rect x="-500" y="-500" width="1633.2" height="1583.04" fill="white"/>
        <polygon points="527.65 315.29 527.71 44.09 105.62 220.38 105.65 356 211.14 311.98 211.14 583.04 316.6 539 316.64 267.96 422.14 223.93 422.14 494.92 633.19 403.1 633.2 271.21 527.65 315.29" fill="black"/>
      </mask>
    </defs>
  </svg>

  <!-- Custom cursor: small white dot with mix-blend-mode: difference
       to invert over the site's elements. -->
  <div class="cursor" aria-hidden="true"></div>

  <!-- Theme wipe: circle that scales full screen with backdrop-filter: invert(1)
       to transition between light and dark mode. Origin = click position. -->
  <span id="theme-wipe" aria-hidden="true"></span>

  <div class="page">

    <!-- TOP -->
    <header class="bar">
      <div class="brand">
        <span>Studio</span>
        <span class="mark" aria-hidden="true">
          <svg class="logo-svg" viewBox="0 0 633.2 583.04" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <!-- L faces grouped under the mask: the highlight area (iso
                 back face) is carved into a transparent hole → negative of the edge. -->
            <g mask="url(#logo-mask)">
              <!-- Each polygon wrapped in a <g class="face face-X">:
                   CSS transforms on <g> are in CSS pixels on all
                   browsers. On a direct <polygon>, Safari
                   interprets them in user units of the local viewBox → ridiculous
                   translates, entrance anim invisible on Safari. -->
              <g class="face face-triangle"><polygon points="633.2 271.21 527.65 315.29 527.64 227.13 633.2 271.21"/></g>
              <g class="face face-top"><polygon points="0 176.33 422.2 0 527.71 44.09 105.62 220.38"/></g>
              <g class="face face-lip"><polygon points="105.65 356 0 311.87 0 176.33 105.62 220.38"/></g>
              <g class="face face-tower"><polygon points="105.65 356 211.15 311.86 211.14 583.04 105.65 539.06"/></g>
              <g class="face face-middle"><polygon points="316.67 450.91 316.64 267.81 422.15 223.74 422.14 494.92 316.67 450.91"/></g>
            </g>
          </svg>
        </span>
      </div>

      <button
        id="themeToggle"
        class="toggle"
        type="button"
        role="switch"
        aria-checked="false"
        aria-label="Basculer le thème clair / sombre"
        title="Thème clair / sombre"
      >
        <svg class="sun-and-moon" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24">
          <mask class="moon" id="moon-mask">
            <rect x="0" y="0" width="100%" height="100%" fill="white" />
            <circle cx="17" cy="10" r="6" fill="black" />
          </mask>
          <circle class="sun" cx="12" cy="12" r="6" mask="url(#moon-mask)" fill="currentColor" />
          <g class="sun-beams" stroke="currentColor">
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </g>
        </svg>
      </button>
    </header>

    <!-- CENTER -->
    <main class="stage">
      <div class="stack">
        <div class="logo-center" aria-hidden="true">
          <svg class="logo-svg" viewBox="0 0 633.2 583.04" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <g mask="url(#logo-mask)">
              <g class="face face-triangle"><polygon points="633.2 271.21 527.65 315.29 527.64 227.13 633.2 271.21"/></g>
              <g class="face face-top"><polygon points="0 176.33 422.2 0 527.71 44.09 105.62 220.38"/></g>
              <g class="face face-lip"><polygon points="105.65 356 0 311.87 0 176.33 105.62 220.38"/></g>
              <g class="face face-tower"><polygon points="105.65 356 211.15 311.86 211.14 583.04 105.65 539.06"/></g>
              <g class="face face-middle"><polygon points="316.67 450.91 316.64 267.81 422.15 223.74 422.14 494.92 316.67 450.91"/></g>
            </g>
          </svg>
        </div>

        <div class="info">
          <h1>Digital sur&#8209;mesure&nbsp;&#8211;&nbsp;Lyon, France</h1>
          <a class="contact" href="mailto:hello@studiotl.fr">hello@studiotl.fr</a>
        </div>
      </div>
    </main>

    <!-- BOTTOM -->
    <footer class="bar">
      <div class="row meta">
        <span class="status" title="Disponible pour vos projets">
          <span class="pulse" aria-hidden="true"></span>
          <span>Disponible pour vos projets<span class="status-aside" id="statusAside" aria-hidden="true"></span></span>
        </span>
        <span class="meta-hide-mobile" aria-hidden="true">–</span>
        <span class="clock meta-hide-mobile" id="clock">—</span>
      </div>

      <div class="row right meta">
        <span>© <span id="year">2026</span></span>
        <span class="meta-hide-mobile" aria-hidden="true">–</span>
        <span class="meta-hide-mobile">Tous droits réservés</span>
      </div>
    </footer>

  </div>

<script>
  /* ---------- Theme: auto + manual override (persisted) + wipe animation ---------- */
  (function () {
    var root = document.documentElement;
    var btn  = document.getElementById('themeToggle');
    var mq   = window.matchMedia('(prefers-color-scheme: dark)');
    var themeColorMetas = document.querySelectorAll('meta[name="theme-color"]');

    // localStorage can throw (blocked storage, some private modes) →
    // fall back to the system preference without persisting.
    function readStored() {
      try { return localStorage.getItem('studiotl-theme'); } catch (e) { return null; }
    }
    function effective() {
      var stored = readStored();
      if (stored === 'dark' || stored === 'light') return stored;
      return mq.matches ? 'dark' : 'light';
    }
    function apply(mode, persist) {
      if (persist) {
        try { localStorage.setItem('studiotl-theme', mode); } catch (e) {}
      }
      // Browser UI color (Safari / mobile address bar): the <meta> tags only
      // follow the system preference, so we overwrite both with the active
      // theme → whichever media query matches, the color is right.
      var barColor = mode === 'dark' ? '#000000' : '#ffffff';
      for (var i = 0; i < themeColorMetas.length; i++) {
        themeColorMetas[i].setAttribute('content', barColor);
      }
      // We ALWAYS set data-theme, regardless of the origin (system or manual).
      // The <head> inline script already did this before the paint. This function
      // is called here to re-align aria + .show-sun after the first
      // interactions or system preference changes.
      root.setAttribute('data-theme', mode);
      root.classList.toggle('is-dark', mode === 'dark');
      btn.setAttribute('aria-checked', mode === 'dark' ? 'true' : 'false');
      // The toggle icon reflects the ALTERNATIVE (see MIKII convention):
      //  - dark mode → we show the SUN → .show-sun ON
      //  - light mode → we show the MOON → .show-sun OFF
      btn.classList.toggle('show-sun', mode === 'dark');
    }

    // initial
    apply(effective(), false);

    var wipe = document.getElementById('theme-wipe');
    var WIPE_DURATION = 700;

    btn.addEventListener('click', function (e) {
      var target = effective() === 'dark' ? 'light' : 'dark';
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Icon: we toggle .show-sun immediately (don't wait for the wipe).
      btn.classList.toggle('show-sun', target === 'dark');

      // No wipe if reduce-motion or element absent
      if (!wipe || reduced) {
        apply(target, true);
        return;
      }

      // Origin = click position (fallback: center of the button)
      var rect = btn.getBoundingClientRect();
      var x = e.clientX || (rect.left + rect.width / 2);
      var y = e.clientY || (rect.top + rect.height / 2);
      wipe.style.left = x + 'px';
      wipe.style.top  = y + 'px';
      void wipe.offsetWidth; // force reflow so the transition starts from scale 0
      wipe.classList.add('is-wiping');

      setTimeout(function () {
        // Atomic theme snap + wipe cleanup at the end of the wipe.
        // invert(old theme) = actual new theme exactly → no pop between the
        // inverted view during the wipe and the real view after the snap.
        document.body.style.transition = 'none';
        apply(target, true);
        wipe.style.transition = 'none';
        wipe.classList.remove('is-wiping');
        void wipe.offsetWidth;
        document.body.style.transition = '';
        wipe.style.transition = '';
      }, WIPE_DURATION);
    });

    mq.addEventListener && mq.addEventListener('change', function () {
      if (!readStored()) apply(effective(), false);
    });
  })();

  /* ---------- Lyon local clock + nighttime status ----------
     Time format depends on <html lang>:
       - fr → 24h, e.g. "14:30 Lyon"
       - en → 12h with AM/PM, e.g. "2:30 PM Lyon"
     The "sleeping" logic stays internally in 24h regardless of the display
     format. The nighttime status text (' (mais là, je dors)') is
     replaced for the EN version by the i18n build. */
  (function () {
    var el = document.getElementById('clock');
    var aside = document.getElementById('statusAside');
    if (!el) return;
    var lang = document.documentElement.lang === 'en' ? 'en' : 'fr';
    function tick() {
      var d = new Date();
      var lyonH = 0, lyonM = 0;
      try {
        // Always fr-FR + hour12:false here → we get the Lyon time
        // in 24h format, regardless of the display language. The 12h
        // conversion is done afterward for EN.
        var parts = new Intl.DateTimeFormat('fr-FR', {
          timeZone: 'Europe/Paris',
          hour: '2-digit', minute: '2-digit', hour12: false
        }).formatToParts(d);
        lyonH = parseInt(parts.find(function (p) { return p.type === 'hour'; }).value, 10);
        lyonM = parseInt(parts.find(function (p) { return p.type === 'minute'; }).value, 10);
      } catch (e) {
        lyonH = d.getHours();
        lyonM = d.getMinutes();
      }
      var mm = String(lyonM).padStart(2, '0');
      var hh, ampm = '';
      if (lang === 'en') {
        // 12h: "12:40 PM", "1:05 AM" (no leading zero on the hours
        // in US convention, unlike the minutes which stay padded).
        hh = String(lyonH % 12 || 12);
        ampm = ' ' + (lyonH >= 12 ? 'PM' : 'AM');
      } else {
        hh = String(lyonH).padStart(2, '0');
      }
      el.textContent = hh + ':' + mm + ampm + ' Lyon';
      if (aside) {
        var total = lyonH * 60 + lyonM;
        var sleeping = total >= (22 * 60 + 30) || total < (6 * 60);
        aside.textContent = sleeping ? ' (mais là, je dors)' : '';
      }
    }
    tick();
    setInterval(tick, 15000);
  })();

  /* ---------- Copyright year ----------
     The HTML holds a static fallback; JS keeps it current without a redeploy. */
  (function () {
    var el = document.getElementById('year');
    if (el) el.textContent = String(new Date().getFullYear());
  })();

  /* ---------- Custom cursor: mouse tracking with lerp ----------
     MIKII inspiration (which used TweenMax + Back.easeOut over 400ms).
     We reproduce the same feeling in pure JS with a lerp of 0.14 per frame:
     that gives ~25 frames to reach the target = ~400ms at 60fps.
     No overshoot from Back.ease, but in continuous use it's invisible. */
  (function () {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    var cursor = document.querySelector('.cursor');
    if (!cursor) return;
    // The centering of the cursor on the mouse is handled by CSS via
    // `transform: translate(-50%, -50%)` (auto-scale with the cursor size).
    // The JS just positions the corner via `translate` (individual property).
    var x = 0, y = 0, tx = 0, ty = 0, raf = null, init = false;
    function frame() {
      raf = null;
      var dx = tx - x;
      var dy = ty - y;
      x += dx * 0.14;
      y += dy * 0.14;
      cursor.style.translate = x + 'px ' + y + 'px';
      if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) request();
    }
    function request() { if (raf === null) raf = requestAnimationFrame(frame); }
    window.addEventListener('mousemove', function (e) {
      tx = e.clientX;
      ty = e.clientY;
      if (!init) {
        x = tx; y = ty;
        cursor.style.opacity = '1';
        init = true;
      }
      request();
    }, { passive: true });
    window.addEventListener('mouseleave', function () { cursor.style.opacity = '0'; });
    window.addEventListener('mouseenter', function () { cursor.style.opacity = '1'; });
  })();

  /* ---------- Mailto underline: reveal LEFT, leave RIGHT ----------
     Behavior:
      - mouseenter: if we were "leaving" (clip on the right), we
        reset WITHOUT transition to the default state (clip on the left), then we
        apply .is-hovering → the reveal always restarts FROM THE LEFT.
      - mouseleave: we remove .is-hovering and add .underline-leaving
        → the underline exits to the RIGHT.
     The double rAF + .no-transition avoids any visible rewind when we
     "rewind" the clip from right to left before the next reveal. */
  (function () {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    var link = document.querySelector('.contact');
    if (!link) return;
    link.addEventListener('mouseenter', function () {
      if (link.classList.contains('underline-leaving')) {
        link.classList.add('no-transition');
        link.classList.remove('underline-leaving');
        // Force reflow → the "default" state (clip on the left) is applied
        // without transition before we remove .no-transition.
        void link.offsetWidth;
        link.classList.remove('no-transition');
      }
      link.classList.add('is-hovering');
    });
    link.addEventListener('mouseleave', function () {
      link.classList.remove('is-hovering');
      link.classList.add('underline-leaving');
    });
  })();

  /* ---------- Magnetic + cursor scale on hover ----------
     Helper applied to several targets (mailto + dark mode toggle).
     Each target: magnetic pull + .is-hover on the cursor.
     - Mailto: transform: translate3d (nothing else on the CSS side)
     - Toggle: style.translate alone (the hover scale is in CSS, to compose) */
  (function () {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    var cursor = document.querySelector('.cursor');

    function magnetize(el, opts) {
      if (!el) return;
      opts = opts || {};
      var divisor = opts.divisor || 6;
      var useIndividualTransform = opts.useIndividualTransform || false;
      var hoverClass = opts.hoverClass || 'is-hover';
      var lx = 0, ly = 0, tx = 0, ty = 0, raf = null, active = false;

      function applyPos() {
        if (useIndividualTransform) {
          el.style.translate = lx.toFixed(2) + 'px ' + ly.toFixed(2) + 'px';
        } else {
          el.style.transform =
            'translate3d(' + lx.toFixed(2) + 'px,' + ly.toFixed(2) + 'px,0)';
        }
      }
      function frame() {
        raf = null;
        lx += (tx - lx) * 0.18;
        ly += (ty - ly) * 0.18;
        applyPos();
        if (Math.abs(tx - lx) > 0.05 || Math.abs(ty - ly) > 0.05) request();
      }
      function request() { if (raf === null) raf = requestAnimationFrame(frame); }

      el.addEventListener('mouseenter', function () {
        active = true;
        if (cursor) cursor.classList.add(hoverClass);
        request();
      });
      el.addEventListener('mouseleave', function () {
        active = false;
        tx = 0; ty = 0;
        if (cursor) cursor.classList.remove(hoverClass);
        request();
      });
      window.addEventListener('mousemove', function (e) {
        if (!active) return;
        var rect = el.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        tx = (e.clientX - cx) / divisor;
        ty = (e.clientY - cy) / divisor;
        request();
      }, { passive: true });
    }

    magnetize(document.querySelector('.contact'), { divisor: 6 });
    // Toggle: magnetic pull + widened cursor (is-hover-lg, 45px) to
    // accentuate the zone. useIndividualTransform → we touch style.translate
    // (not .transform) so as not to overwrite the scale: 1.1 of the :hover in CSS.
    magnetize(document.getElementById('themeToggle'), {
      divisor: 4,
      useIndividualTransform: true,
      hoverClass: 'is-hover-lg'
    });
  })();

</script>
</body>
</html>
